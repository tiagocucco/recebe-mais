- # ====== Region: Gerenciar Módulos ===========================
  id: 1733681841731628
  identification: 
    title: Gerenciar Módulos
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select MODULE_ID,
             MODULE_CODE,
             MODULE_NAME,
             DESCRIPTION,
             STATUS,
             '<label class="a-Switch"> 
              <input type="checkbox" 
                     class="my-row-switch" 
                     data-id="' || MODULE_ID || '" ' || 
                     CASE WHEN STATUS = 'Y' THEN 'checked' ELSE '' END || '> 
              <span class="a-Switch-toggle"></span> 
              </label>' AS STATUS_TOGGLE,
             DISPLAY_ORDER,
             '<i class="fa ' || ICON_CLASS || '"> </i>' AS ICON_CLASS,
             '<label class="a-Switch"> 
              <input type="checkbox" 
                     class="my-row-switch" 
                     data-id="' || MODULE_ID || '" ' || 
                     CASE WHEN IS_SYSTEM = 'Y' THEN 'checked' ELSE '' END || '> 
              <span class="a-Switch-toggle"></span> 
              </label>' AS IS_SYSTEM,
             CREATION_DATE,
             CREATED_BY,
             UPDATED_DATE,
             UPDATED_BY,
             INACTIVE_DATE
        from RMAIS_SEC_MODULES

  layout: 
    sequence: 10
    parent-region: No Parent
    position: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

