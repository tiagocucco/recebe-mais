  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ACCESS_ID,
             DESCRIPTION,
             PAGE_ID,
             CASE 
              WHEN STATUS = 'Y' THEN '<i class="fa fa-check-circle" style="color:green;"></i>' 
              ELSE '<i class="fa fa-times-circle" style="color:red;"> </i>' 
