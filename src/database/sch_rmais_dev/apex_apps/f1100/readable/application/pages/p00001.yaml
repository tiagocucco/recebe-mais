- # ====== Region: Card Modules ================================
  id: 1892075566134089
  identification: 
    title: Card Modules
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT DISTINCT
             sm.module_id,
             sm.module_name AS card_title,
             sm.description AS card_link,
             sm.icon_class AS card_icon,
             NULL AS card_text,
             (
               SELECT COUNT(*)
                 FROM rmais_sec_module_pages smp
                WHERE smp.module_id = sm.module_id
                  AND smp.status = 'Y'
                  AND EXISTS (
                        SELECT 1
                          FROM rmais_users_access ua
                         WHERE ua.access_id = smp.access_id
                           AND ua.status = 'Y'
                      )
             ) || ' páginas disponíveis' AS card_subtext
        FROM rmais_sec_modules sm
        JOIN rmais_sec_group_module_perm gmp
          ON gmp.module_id = sm.module_id
         AND gmp.status = 'Y'
         AND gmp.view_flag = 'Y'
        JOIN rmais_users_user_groups uug
          ON uug.group_id = gmp.group_id
         AND uug.status = 'Y'
        JOIN rmais_users u
          ON u.user_id = uug.user_id
         AND u.status = 'Y'
       WHERE sm.status = 'Y'
         AND UPPER(u.user_name) = UPPER(:APP_USER)
       ORDER BY sm.module_name

  layout: 
    sequence: 20
    parent-region: No Parent
    position: BODY
    start-new-layout: false
    start-new-row: false
