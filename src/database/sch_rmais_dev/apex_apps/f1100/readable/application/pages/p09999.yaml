processes: 
- # ====== Process: LoadSecurityAccess =========================
  id: 2357718558890972
  identification: 
    name: LoadSecurityAccess
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      rmais_pkg_security.load_user_security(
          p_user_name => :P9999_USERNAME
      );
         

  execution: 
    sequence: 30
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: LOGIN # 1813273040847082373

- # ====== Process: New ========================================
  id: 194348982876278443
  identification: 
    name: New
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          XXRMAIS_UTIL_V2_PKG.alterar_senha(:P9999_USERNAME,'RMAIS','Sua nova senha é ');
      end;

  execution: 
    sequence: 50
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Sua nova senha foi enviado via email.

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: FORGOT_PASSWORD # 194348858664278442

- # ====== Process: Login ======================================
  id: 1813273517865082374
  identification: 
    name: Login
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      apex_authentication.login(
          p_username => :P9999_USERNAME,
          p_password => :P9999_PASSWORD );
      
         

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: LOGIN # 1813273040847082373

- # ====== Process: Set Username Cookie ========================
  id: 1813273889381082374
  identification: 
    name: Set Username Cookie
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      apex_authentication.send_login_username_cookie (
          p_username => lower(:P9999_USERNAME),
          p_consent  => :P9999_REMEMBER = 'Y' );

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: LOGIN # 1813273040847082373

- # ====== Process: Get Username Cookie ========================
  id: 1813274314987082374
  identification: 
    name: Get Username Cookie
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      :P9999_USERNAME := apex_authentication.get_login_username_cookie;
      :P9999_REMEMBER := case when :P9999_USERNAME is not null then 'Y' end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

