- # ====== Process: Save Users Groups ==========================
  id: 2019735853882869
  identification: 
    name: Save Users Groups
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          l_selected_groups apex_t_varchar2;
      BEGIN
          -- 1. Converte a string do Shuttle (ex: '10:20:30') em uma coleção (array)
          l_selected_groups := apex_string.split(:P10905_GROUPS, ':');
      
          -- 2. Remove os grupos
          DELETE FROM RMAIS_USERS_USER_GROUPS
          WHERE USER_ID = :P10905_USER_ID;
      
          -- 3. Insere os grupos selecionados
          FOR i IN 1..l_selected_groups.count LOOP
                  INSERT INTO RMAIS_USERS_USER_GROUPS(
                      USER_ID, 
                      GROUP_ID, 
                      STATUS, 
                      CREATION_DATE, 
                      CREATED_BY, 
                      UPDATED_DATE, 
                      UPDATED_BY
                  )
                  VALUES (
                      :P10905_USER_ID, 
                      l_selected_groups(i), 
                      'Y', 
                      SYSDATE, 
                      lower(:APP_USER), 
                      SYSDATE, 
                      lower(:APP_USER)
                  );
          END LOOP;
      END;
      

  execution: 
    sequence: 40
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

- # ====== Process: ValidateUpdatePasswordHash =================
  id: 2357793118890973
  identification: 
    name: ValidateUpdatePasswordHash
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P10905_PASSWORD != :P10905_CONFIRM_PASSWORD then
              APEX_ERROR.ADD_ERROR(
                  p_message          => 'Campos de Password não conferem! Ajuste e salve novamente.',
                  p_display_location => APEX_ERROR.C_INLINE_IN_NOTIFICATION
                  );
          end if;
      
          SELECT STANDARD_HASH(:P10905_PASSWORD, 'SHA256')
          INTO :P10905_PASSWORD
          FROM DUAL;
      
      end;    

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

