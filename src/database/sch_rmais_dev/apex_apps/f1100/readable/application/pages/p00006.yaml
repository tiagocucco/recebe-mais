- # ====== Dynamic Action: New_1 ===============================
  id: 1775521373289061496
  identification: 
    name: New_1

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: EVENT.EVENT.BROWSER.CLICK
    selection-type: Button
    button: New # 1775521291026061495

  actions: 
  - # ====== Action: Set Value ===================================
    id: 1775521503626061497
    identification: 
      action: Set Value

    settings: 
      set-type: PL/SQL Function Body
      pl/sql-function-body: "return nvl(:AD_EMAIL,'NUULOI');"
      items-to-submit: 
      - AD_EMAIL
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P6_NEW

    execution: 
      sequence: 10
      event: New_1 # 1775521373289061496
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Refresh =====================================
    id: 1775521648060061498
    identification: 
      action: Refresh

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P6_NEW

    execution: 
      sequence: 20
      event: New_1 # 1775521373289061496
      fire-when-event-result-is: True
      fire-on-initialization: false

