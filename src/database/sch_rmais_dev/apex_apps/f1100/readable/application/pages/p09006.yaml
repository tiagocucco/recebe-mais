    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      -- 1. ROLE
      SELECT 
          1 as ordem,
          null as selection, 
          null as actions, 
          null as item_classes, 
          null as icon_html,
          'fa fa-shield' as icon_class, 
          'Role' as title, 
          c001 as description, 
          'Security' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      
      UNION ALL
      
      -- 2. PRIVILEGE
      SELECT 
          2,
          null, 
          null, 
          null, 
          null,
          'fa fa-key' as icon_class, 
          'Privilege' as title, 
          c003 || ' (' || c002 || ')' as description, 
          'Access' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      
      UNION ALL
      
      -- 3. OAUTH (Módulo e Token)
      SELECT 
          3,
          null, null, null, null,
          'fa fa-share-alt' as icon_class, 
          'Module (API)' as title, 
          c005 as description, 
          'OAuth' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      UNION ALL
      SELECT 
          4,
          null, 
          null, 
          null, 
          null,
          'fa fa-clock-o' as icon_class, 
          'Token duration' as title, 
          c009 || ' seconds' as description, 
          'OAuth' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      
      UNION ALL
      
      -- 4. CLIENT / IDENTITY
      SELECT 
          5,
          null, 
          null, 
          null, 
          null,
          'fa fa-id-card-o' as icon_class, 
          'Client' as title, 
          c006 as description, 
          'Identity' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      UNION ALL
      SELECT 
          6,
          null, 
          null, 
          null, 
          null,
          'fa fa-envelope-o' as icon_class, 
          'Support' as title, 
          c008 as description, 
          'Identity' as misc
      FROM apex_collections WHERE collection_name = 'RMAIS_ORDS_OAUTH_WIZARD'
      ORDER BY 1
      

