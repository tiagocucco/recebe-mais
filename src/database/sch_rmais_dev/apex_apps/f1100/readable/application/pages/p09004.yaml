processes: 
- # ====== Process: SavePrivilege ==============================
  id: 2021848904882890
  identification: 
    name: SavePrivilege
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 2,
              p_attr_value      => :P9004_PRIVILEGE_NAME
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 3,
              p_attr_value      => :P9004_PRIVILEGE_LABEL
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 4,
              p_attr_value      => :P9004_MODULE_ID
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 5,
              p_attr_value      => :P9004_MODULE_URI
          );
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

