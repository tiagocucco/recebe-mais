regions: 
- # ====== Region: View Client Credentials =====================
  id: 2403883440155080
  identification: 
    title: View Client Credentials
    type: Form

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          c.id,
          c.name                                      AS client_name,
          c.description,
          c.client_id,
          c.client_secret,
          SUBSTR(c.client_secret,1,6) || '******' AS client_secret_masked,
          c.auth_flow,
          CASE
              WHEN c.auth_flow = 'client_credentials'
              THEN 'u-success-text'
              ELSE 'u-warning-text'
          END                                         AS auth_flow_class,
          nvl(c.token_duration,'360') as token_duration,
          c.support_email,
          cr.role_name,
          m.uri_prefix,
          c.created_by,
          c.created_on
      
      FROM user_ords_clients c
      
      LEFT JOIN user_ords_client_roles cr
             ON cr.client_name = c.name
      
      LEFT JOIN user_ords_roles r
             ON r.id = cr.role_id
      
      LEFT JOIN user_ords_privilege_roles pr
             ON pr.role_id = r.id              
      
      LEFT JOIN user_ords_privileges p
             ON p.id = pr.privilege_id
      
      LEFT JOIN user_ords_privilege_modules pm
             ON pm.privilege_id = p.id
      
      LEFT JOIN user_ords_modules m
             ON m.id = pm.module_id
      
      WHERE c.id = :P9007_ID       
      
      ORDER BY c.created_on DESC;

  layout: 
    sequence: 10
    parent-region: No Parent
    position: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes # 1813152766463082238
