- # ====== Process: SaveClient =================================
  id: 2022061986882892
  identification: 
    name: SaveClient
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 6,
              p_attr_value      => :P9005_CLIENT_NAME
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 7,
              p_attr_value      => :P9005_CLIENT_DESCRIPTION
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 8,
              p_attr_value      => :P9005_SUPPORT_EMAIL
          );
      
          APEX_COLLECTION.UPDATE_MEMBER_ATTRIBUTE(
              p_collection_name => 'RMAIS_ORDS_OAUTH_WIZARD',
              p_seq             => 1,
              p_attr_number     => 9,
              p_attr_value      => :P9005_TOKEN_DURATION        
          );
          
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

