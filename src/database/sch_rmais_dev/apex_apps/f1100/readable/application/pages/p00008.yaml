      - P8_REPLICAR_CFOPS
      - P8_CFOP_OUT
      - P8_UOM_DESC
      - P8_UOM_DESC_PO
      - P8_RECEIPT_NUM
      - P8_RECEIPT_LINE_NUM

    execution: 
