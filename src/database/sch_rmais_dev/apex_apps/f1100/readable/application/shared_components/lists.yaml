- # ====== List: Custom Nav Menu ===============================
  id: 3392168170671941
  identification: 
    name: Custom Nav Menu

  source: 
    type: SQL Query
    sql-query: |
      SELECT 
          LEVEL                 AS lvl,           -- Controla a identação hierárquica nativa do APEX
          c.c002                AS label,         -- Rótulo do menu (ENTRY_TEXT)
          c.c003                AS target,        -- URL de destino (ENTRY_TARGET)
          'YES'                 AS is_current,    -- Permite que o APEX gerencie o estado ativo automaticamente
          c.c006                AS image          -- Ícone FontAwesome do menu (ENTRY_IMAGE)
      FROM 
          apex_collections c
      WHERE 
          c.collection_name = 'RMAIS_ALLOWED_MENUS'
      -- Reconstrói dinamicamente os níveis de Menu Pai e Submenu com base nos IDs salvos
      START WITH 
          c.c005 IS NULL OR c.c005 = '0'
      CONNECT BY 
          PRIOR c.c004 = c.c005
      -- Mantém a ordenação exata estipulada no desenvolvimento da aplicação
      ORDER SIBLINGS BY 
          c.n001;
      

