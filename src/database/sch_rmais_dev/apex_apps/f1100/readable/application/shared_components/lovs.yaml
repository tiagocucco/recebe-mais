- # ====== List of Values: LOV_APEX_PAGES ======================
  id: 1578441309780149
  identification: 
    name: LOV_APEX_PAGES

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select PAGE_NAME || ' (ID '||PAGE_ID||')' AS PAGE_NAME, PAGE_ID
       from  APEX_APPLICATION_PAGES 
      where  application_id = :APP_ID

  column-mapping: 
    return: PAGE_ID
    display: PAGE_NAME
    default-sort: PAGE_ID
    sort-direction: Ascending (Nulls Last)

